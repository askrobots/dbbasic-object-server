name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Browser end-to-end (generated UI)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # websockets (not just uvicorn/pytest/pytest-playwright) matters
        # here specifically: the generated list (window.dbbasicList)
        # refreshes ONLY over a live /ws push -- there is no polling
        # fallback for it (unlike the nav bell's 20s poll) -- so without
        # it the "new record appears without a reload" tests would flake
        # or hang waiting on a socket uvicorn can't upgrade.
        run: |
          python -m pip install --upgrade pip
          python -m pip install uvicorn websockets pytest pytest-playwright

      - name: Install browsers
        # Chromium drives test_generated_ui.py; WebKit drives
        # test_talk_voice.py specifically because it is the iPad's real
        # engine family -- that choice is load-bearing (it is what let
        # the harness catch iOS-only failures: the exclusive-microphone
        # theft, the gesture-locked audio element) and switching it to
        # Chromium to dodge an install gap would throw away the reason
        # the file exists. Retried like docker.yml's compose pull: this
        # downloads browser binaries from Playwright's CDN, which times
        # out on GitHub runners often enough to red-X main for reasons
        # that have nothing to do with the commit. Three attempts with
        # backoff; a real install failure still fails all three and
        # reports normally.
        run: |
          for attempt in 1 2 3; do
            echo "::group::playwright install chromium webkit (attempt ${attempt})"
            if python -m playwright install --with-deps chromium webkit; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt ${attempt} failed"
            [ "${attempt}" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "playwright install failed three times -- not a transient CDN blip"
          exit 1

      - name: Run browser end-to-end tests
        run: python3 -m pytest -m e2e tests/e2e -q
